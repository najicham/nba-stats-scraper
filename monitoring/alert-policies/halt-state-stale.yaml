# Cloud Monitoring Alert Policy — halt_state_writer is broken
#
# Fires when halt_state_writer stops emitting, i.e. no halt_state row is being
# written. Since 2026-08-21 halt_state GATES pick publishing: a missing recent
# row makes BaseExporter.halt_envelope fail CLOSED, so a dead writer produces
# ZERO PICKS, not just cosmetic "unknown" branding. That is why this is
# Critical and why the condition is absence-based.
#
# HOW THIS CAME TO BE ABLE TO FIRE AT ALL. The writer emits this metric only on
# a SUCCESSFUL write, once a day, so:
#   - a threshold condition could never fire (a dead writer emits nothing, so
#     there is no series to evaluate), and
#   - an absence condition could not be configured either: Cloud Monitoring
#     rejects conditionAbsent.duration above 23h30m, and a healthy once-daily
#     emitter has a ~24h gap, so every valid duration false-fires daily.
# `phase-completion-reconciler` (ENABLED, every 30 min) therefore also emits
# halt_state_age_hours, computed from the table. That gives the metric a
# continuous series whose VALUE grows when the writer dies — so an ordinary
# threshold works, and this policy can finally do its job.
#
# Pipeline-state-redesign Phase G; rewritten 2026-08-21.

displayName: "[NBA Pipeline] halt_state_writer not writing (Critical)"
documentation:
  content: |
    ## halt_state Writer Not Writing

    **Severity:** Critical
    **Impact:** **Picks stop publishing.** `halt_state` is the publish gate
    (`signal_best_bets_exporter` Step 0). With no row for the date and none
    within the 3-day carry-forward window, `halt_envelope` fails CLOSED —
    `halt_active=true`, `halt_reason='unknown_state'` — and the exporter
    ships zero picks. The 2026-08-16..19 gap was four consecutive days and
    was never backfilled; in-season that would have been a silent drought.

    Backfill any missed dates once the writer is healthy — nothing does it
    automatically:
    ```bash
    curl "$(gcloud functions describe halt-state-writer --gen2 \
      --region=us-west2 --format='value(serviceConfig.uri)')/?sport=all&target_date=YYYY-MM-DD"
    ```

    ### What this means
    The halt_state_writer Cloud Function hasn't written today's row.
    Either the daily 5 AM ET scheduler is broken, or the function itself
    is failing.

    ### Immediate actions
    1. Check the row directly:
       ```sql
       SELECT * FROM `nba-props-platform.nba_orchestration.halt_state`
       WHERE effective_date >= CURRENT_DATE() - 3 ORDER BY written_at DESC
       ```
    2. Check the scheduler:
       ```bash
       gcloud scheduler jobs describe halt-state-writer-daily \
         --location=us-west2 --project=nba-props-platform
       ```
    3. Check the CF logs:
       ```bash
       gcloud functions logs read halt-state-writer \
         --region=us-west2 --gen2 --project=nba-props-platform --limit=50
       ```
    4. Manually trigger:
       ```bash
       curl -X GET "$(gcloud functions describe halt-state-writer --gen2 \
         --region=us-west2 --format='value(serviceConfig.uri)')/?sport=all"
       ```

    ### Reference
    - Runbook: docs/02-operations/runbooks/halt-mode-operations.md
  mimeType: text/markdown

conditions:
  - displayName: "halt_state has not been written in 30h"
    # Threshold on the reconciler-emitted age (see header). Writer runs 05:00 ET
    # daily and the signal-best-bets export runs ~13:00 ET, so 30h fires after
    # one clearly-missed daily write and well before the 3-day carry-forward
    # window is exhausted and picks start being suppressed.
    conditionThreshold:
      filter: |
        metric.type="custom.googleapis.com/nba_pipeline/halt_state_age_hours"
        resource.type="global"
      aggregations:
        - alignmentPeriod: 1800s   # 30 min, matching the reconciler cadence
          perSeriesAligner: ALIGN_MAX
      comparison: COMPARISON_GT
      thresholdValue: 30
      duration: 1800s

  # Belt and braces: if BOTH emitters stop, there is no value to threshold on.
  # 23h is inside Cloud Monitoring's 23h30m cap and far above the reconciler's
  # 30-minute cadence, so it cannot false-fire on a healthy series.
  - displayName: "halt_state_age_hours series absent for 23h"
    conditionAbsent:
      filter: |
        metric.type="custom.googleapis.com/nba_pipeline/halt_state_age_hours"
        resource.type="global"
      aggregations:
        - alignmentPeriod: 1800s
          perSeriesAligner: ALIGN_MAX
      duration: 82800s

combiner: OR

enabled: true

alertStrategy:
  autoClose: 604800s

notificationChannels:
  - projects/nba-props-platform/notificationChannels/13444328261517403081
