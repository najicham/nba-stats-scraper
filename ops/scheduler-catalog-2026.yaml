# Restore catalog for the scheduler jobs deleted on 2026-07-03.
#
# COUNT CORRECTION: the manifest's summary line says "RESTORE 58 (waves A=19,
# B=18, C=21)". Its Wave B table actually has 19 rows, so the real total is 59.
# Counting the tables: A=19 (one row covers player-movement-registry-morning AND
# -afternoon), B=19, C=21. This catalog has 59.
#
# READ THIS FIRST
# ---------------
# The manifest (docs/02-operations/scheduler-restore-manifest-2026.md) named a
# GCS backup as the source of truth for these configs. That backup is GONE --
# the bucket has a 30-day delete lifecycle rule and the file aged out around
# 2026-08-02. GCP-side recovery was attempted and failed:
#
#   - gs://nba-bigquery-backups/scheduler-jobs-backup/  : no objects
#   - no copy in any other project bucket or in the repo
#   - Cloud Scheduler admin audit logs go back to 2025-07-21 (400d retention) and
#     DO carry schedule / timeZone / retryConfig for some jobs, but GCP redacts
#     httpTarget and pubsubTarget entirely, so URI, headers, body and OIDC are
#     not recoverable from logs for any job.
#
# So this file is a RECONSTRUCTION, not a backup replay. Every entry carries a
# `provenance` field saying where its definition came from, and `verified` says
# whether the definition is known-good or needs a human to confirm it before the
# job is resumed:
#
#   repo_script   exact `gcloud scheduler jobs create` command exists in the repo
#   live_pattern  target/body copied from an equivalent job still live today
#   manifest      schedule + target from the manifest; body inferred from the
#                 service's documented route contract
#   needs_input   cannot be reconstructed confidently -- a human must supply it
#
# Jobs with `verified: false` are created PAUSED like all the others, but
# scripts/nba_offseason_restore_jobs.py refuses to create `needs_input` entries
# unless you pass --allow-unverified, so a guess never reaches production silently.
#
# Shared defaults (measured across the 110 jobs still live on 2026-08-20):
#   service account   756957797294-compute@developer.gserviceaccount.com  (71/84)
#   oidc audience     equal to the target URI without query string        (56/84)
#   headers           Content-Type: application/json
#   retryConfig       minBackoff 5s, maxBackoff 3600s, maxDoublings 5
#
# Timezone note: three jobs are America/Los_Angeles. Do NOT normalize them to ET.

defaults:
  service_account: 756957797294-compute@developer.gserviceaccount.com
  headers:
    Content-Type: application/json
  retry:
    minBackoffDuration: 5s
    maxBackoffDuration: 3600s
    maxDoublings: 5
  attempt_deadline: 180s
  create_paused: true

services:
  scrapers:     https://nba-scrapers-f7p3g7f6ya-wl.a.run.app
  phase2:       https://nba-phase2-raw-processors-f7p3g7f6ya-wl.a.run.app
  phase3:       https://nba-phase3-analytics-processors-f7p3g7f6ya-wl.a.run.app
  phase4:       https://nba-phase4-precompute-processors-f7p3g7f6ya-wl.a.run.app
  coordinator:  https://prediction-coordinator-f7p3g7f6ya-wl.a.run.app

